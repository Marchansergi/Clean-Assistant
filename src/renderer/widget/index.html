<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Clean Assistant</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="notch" class="notch">
    <!-- Barra del notch (visible recogido) -->
    <div class="bar" id="bar" title="Abrir">
      <span class="bar-avatar" id="barAvatar"></span>
      <span class="bar-text">
        <span class="bar-name" id="barName">Clau</span>
        <span class="bar-status" id="barStatus"></span>
      </span>
      <span class="bar-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <button class="bar-stop" id="barStop" title="Detener">■</button>
    </div>

    <!-- Panel desplegado -->
    <main class="panel" id="panel">
      <header class="top">
        <div class="hero-avatar" id="heroAvatar"></div>
        <div class="hero-text">
          <div class="hero-line">
            <span class="hero-name" id="heroName">Clau</span>
            <select class="model-select" id="modelSelect" title="Modelo"></select>
          </div>
          <div class="hero-status" id="heroStatus"><span class="dot"></span><span class="label">Lista</span></div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="menuBtn" title="Menú">⋯</button>
          <button class="icon-btn" id="minBtn" title="Recoger">⌃</button>
        </div>
        <div class="menu hidden" id="menu">
          <button data-menu="new">Nueva conversación</button>
          <button data-menu="agents">Mis agentes</button>
          <button data-menu="settings">Ajustes</button>
          <hr>
          <button data-menu="quit" class="danger-text">Salir</button>
        </div>
      </header>

      <nav class="agent-switch" id="agentSwitch"></nav>

      <section class="view" id="viewChat">
        <div class="messages" id="messages"></div>
        <div class="confirm hidden" id="confirm">
          <div class="confirm-title" id="confirmTitle"></div>
          <pre class="confirm-detail" id="confirmDetail"></pre>
          <div class="confirm-actions">
            <button class="btn ghost" id="confirmNo">No</button>
            <button class="btn primary" id="confirmYes">Permitir</button>
          </div>
        </div>
        <footer class="composer" id="composer">
          <textarea id="prompt" rows="1" placeholder="Dime qué hago en tu ordenador…"></textarea>
          <button class="send" id="sendBtn" title="Enviar">↑</button>
          <button class="stop hidden" id="stopBtn" title="Detener">■ <span id="stopLabel">Detener</span></button>
        </footer>
      </section>

      <section class="view panel-view hidden" id="viewAgents">
        <div class="panel-head"><button class="icon-btn back" data-back>←</button><h2>Mis agentes</h2></div>
        <div class="panel-body" id="agentsBody"></div>
      </section>

      <section class="view panel-view hidden" id="viewSettings">
        <div class="panel-head"><button class="icon-btn back" data-back>←</button><h2>Ajustes</h2></div>
        <div class="panel-body" id="settingsBody"></div>
      </section>
    </main>
  </div>
  <script src="widget.js"></script>
</body>
</html>
